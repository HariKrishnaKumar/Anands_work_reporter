<VirtualHost *:${APACHE_PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Security headers
    <IfModule mod_headers.c>
        Header set X-Frame-Options "SAMEORIGIN"
        Header set X-Content-Type-Options "nosniff"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'"
        Header unset X-Powered-By
        Header always unset Server
        ServerSignature Off
    </IfModule>

    # Block sensitive files
    <Directory /var/www/html>
        <Files ".env">
            Require all denied
        </Files>
        <Files ".git">
            Require all denied
        </Files>
        <Files "composer.json">
            Require all denied
        </Files>
        <Files "composer.lock">
            Require all denied
        </Files>
        <Files "deployment-secrets.txt">
            Require all denied
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
